[package]
name = "rustos"
version = "0.1.0"
authors = ["RustOS Team"]
edition = "2021"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
bootloader = "0.9.23"
volatile = "0.2.6"
spin = "0.5.2"
lazy_static = { version = "1.0", features = ["spin_no_std"] }
uart_16550 = "0.2.0"
x86_64 = "0.14.2"

[dependencies.pic8259]
version = "0.10.1"
optional = true

[package.metadata.bootimage]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-display", "none"
]
test-success-exit-code = 33  # (0x10 << 1) | 1

[[bin]]
name = "rustos"
test = false
bench = false

[[test]]
name = "should_panic"
harness = false
