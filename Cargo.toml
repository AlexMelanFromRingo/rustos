[package]
name = "rustos"
version = "0.1.0"
authors = ["RustOS Team"]
edition = "2021"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
bootloader = "0.9.23"
volatile = "0.2.6"
spin = "0.5.2"
lazy_static = { version = "1.0", features = ["spin_no_std"] }

[[bin]]
name = "rustos"
test = false
bench = false
