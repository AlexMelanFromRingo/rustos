[package]
name = "rustos"
version = "0.1.0"
authors = ["RustOS Team"]
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Keep DWARF in the kernel binary so build.rs can extract source-line
# info via addr2line for symbolised panic backtraces.  bootloader 0.9
# strips the unloaded .debug_* sections when building the bootimage,
# so this only adds size to the on-disk ELF, not the running kernel.
debug = 2

[dependencies]
bootloader = { version = "0.9.23", features = ["map_physical_memory"] }
volatile = "0.2.6"
spin = "0.5.2"
lazy_static = { version = "1.0", features = ["spin_no_std"] }
uart_16550 = "0.2.0"
x86_64 = "0.14.2"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.9.0"
crossbeam-queue = { version = "0.3.8", default-features = false, features = ["alloc"] }
conquer-once = { version = "0.2.0", default-features = false }
futures-util = { version = "0.3.4", default-features = false, features = ["alloc"] }

[package.metadata.bootimage]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-display", "none"
]
test-success-exit-code = 33  # (0x10 << 1) | 1

[[bin]]
name = "rustos"
test = false
bench = false

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "vfs_test"
harness = false
